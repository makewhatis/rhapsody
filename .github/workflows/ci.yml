name: ci
on:
  pull_request:
  push:
    branches: [main]

# Self-hosted runner (davds-macbook-pro-rhapsody): repo-scoped, like the tally/booch runners.
# rustup lives in ~/.cargo/bin which is not in the runner's seeded PATH — each rust job adds it.
jobs:
  lint:
    # Fork-PR guard (TRA-264): every job runs only on trusted events — a push, or a same-repo
    # `pull_request` (head repo IS this repo). A fork PR skips all jobs so untrusted code never
    # executes on the self-hosted Mac runner; its required checks never report, keeping it
    # unmergeable until a maintainer pulls it to a same-repo branch. Keep this on every job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show   # installs the toolchain pinned by rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show
      - run: cargo test --workspace

  web:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on the self-hosted runner: the machine's npm cache is already
          # local + persistent, and the post-job step would upload ~1GB to GitHub per run.
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # Build the dashboard bundle into crates/httpapi/web-dist/ (vite outDir), the rust-embed
      # source for the embedded dashboard (P6-H1). Proves the build + outDir move stay green.
      - run: npm run build
        working-directory: web

  # F1 boot gate: the assembled `rhapsodyd` daemon completes a scripted issue end-to-end against the
  # R3 harness (linear-stub + fake-claude), serves the embedded dashboard non-empty, its live
  # /api/v1/config byte-matches the committed golden, and `rhapsodyd mcp` reaches it via runtime.json.
  # boot.sh builds the web dist (rust-embed source) then the daemon, so it is self-contained (jobs
  # don't share a filesystem). NOTE: add `boot-e2e` to the branch-protection required contexts to gate
  # merges on it (needs admin, like the lint/test/web contexts — see the PR body).
  boot-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show
      - run: harness/e2e/boot.sh

  # The Tauri desktop app (P7) is its OWN cargo workspace, excluded from the root workspace, so it
  # is linted/built/tested here rather than by the `lint`/`test` jobs. Unsigned build only — the
  # signed/notarized .app + .dmg are human-gated (P7-D5 / desktop SIGNING). Job name `desktop` is a
  # branch-protection context; keep it stable.
  desktop:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show   # installs the toolchain pinned by the shared repo-root rust-toolchain.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on the self-hosted runner (same rationale as the web job).
      # Since TRA-251 `web/` IS the Tauri window's frontend (tauri.conf.json `frontendDist` ->
      # crates/httpapi/web-dist) — the interim desktop/frontend shell was retired. The cargo steps
      # below compile against the committed `.gitkeep` anchor (an empty dist is fine —
      # `tauri::generate_context!` embeds whatever is there); `make app` builds the real bundle. `web/`
      # itself is built + tested by the `web` job.
      - run: cargo fmt --all --check
        working-directory: desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: desktop
      # Unit + supervisor-lifecycle + packaging-gate tests. Default features build the `fakedaemon`
      # supervisor stub the integration tests need (the packaging build turns it off — see below).
      - run: cargo test
        working-directory: desktop
      # P7-D5 packaging build gate: the Tauri bundler produces the UNSIGNED Rhapsody.app. The CLI
      # install is idempotent and persists on the self-hosted runner. `make app` (run from the repo
      # root) builds the web/ dashboard (both the daemon embed AND the Tauri frontend) + the release
      # rhapsodyd sidecar, bundles the app with the fakedaemon stub excluded (`--no-default-features`), and copies
      # the sidecar into Contents/Resources — everything the parity e2e below needs.
      #
      # We deliberately build `make app`, NOT `make dmg`, on PRs: the DMG packaging (hdiutil) is
      # release-only (release.yml builds + signs + notarizes it) and, because the self-hosted runner is
      # a dev Mac, `hdiutil` fails with "Operation not permitted" whenever a volume named `Rhapsody` is
      # already mounted (e.g. the app running from a mounted DMG). The parity e2e consumes the `.app`
      # bundle (Contents/MacOS -> Contents/Resources/rhapsodyd), never the `.dmg`, so `make app` is the
      # correct, collision-free PR gate.
      - run: command -v cargo-tauri >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked
      - run: make app
      # P7-D5 parity e2e: the app's supervisor drives the packaged rhapsodyd through
      # start -> healthy -> dashboard -> stop (against the R3 linear-stub + fake-claude harness). Gated
      # by RHAPSODY_PARITY_E2E so only this explicit step runs it (it needs the bundle `make app` built).
      - run: RHAPSODY_PARITY_E2E=1 cargo test -p rhapsody-desktop --test parity_e2e -- --nocapture
        working-directory: desktop
