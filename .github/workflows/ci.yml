name: ci
on:
  pull_request:
  push:
    branches: [main]

# Self-hosted runners (STUDIO-1028): repo-scoped, like the tally/booch runners. PR-time jobs run on
# the Linux pool (`rhapsody-linux`: djohansen-fedora-desktop-1-rhapsody-{1,2,3}, each with its own
# warm `_work`), while the two jobs whose output must match what ships (`test`, `boot-e2e`) fall back
# to the macOS pool (`mac-arm-{1..4}`) on a push to main, and `desktop` (the Tauri `.app`) is macOS
# everywhere. The Macs were the only runners until 2026-09-23, when they saturated (queued runs,
# "not acquired by Runner of type self-hosted", boot-e2e timeouts); moving PR traffic to Linux keeps
# the Macs for the desktop and main gates.
# rustup lives in ~/.cargo/bin which is not in the runner's seeded PATH — each rust job adds it.
jobs:
  lint:
    # Fork-PR guard (TRA-264): every job runs only on trusted events — a push, or a same-repo
    # `pull_request` (head repo IS this repo). A fork PR skips all jobs so untrusted code never
    # executes on the self-hosted runners; its required checks never report, keeping it
    # unmergeable until a maintainer pulls it to a same-repo branch. Keep this on every job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, rhapsody-linux]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show   # installs the toolchain pinned by rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # STUDIO-599: prompt text has no compiler, so the invariants of `.rhapsody/PROMPT.md` (design
      # records dual-written to ~/.rhapsody/docs/, that directory as a read-only exception, never
      # committing a process document, stopping rather than reconstructing an unreadable required
      # input) are pinned by a case table instead. Cheap and bash-only — it rides the existing `lint`
      # job rather than adding a branch-protection context that would not be required.
      - run: harness/prompt/prompt_test.sh
      # STUDIO-867: same reasoning for the Claude Code plugin this repo ships — a marketplace
      # `source` that does not resolve installs nothing while adding cleanly, and the shipped files
      # are public. Bash + python3 only, so it rides `lint` rather than adding a required context.
      - run: .github/scripts/check-plugin.sh
      # ...and the leak scan inside it is itself pinned: a guard nobody has watched fire is not a
      # guard. This reintroduces each leak into a throwaway copy of the shipped tree and asserts the
      # scan reds on it — the first, case-sensitive version reported clean on a lower-case name and
      # on the `linear.app/<slug>/` of a pasted ticket link, which is how both would have shipped.
      - run: .github/scripts/check-plugin_test.sh

  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # PR-time proves the tree on Linux; a push to main re-runs it on macOS, which is what ships.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","rhapsody-linux"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show
      - name: DIAGNOSTIC (temporary, STUDIO-1028)
        run: |
          nproc; uptime; date +%s.%N
          echo "TMPDIR=$TMPDIR"
          echo "--- bash -lc latency ---"
          for i in 1 2 3; do
            /usr/bin/time -f "echo: %e s" bash -lc 'echo boom-output; exit 3' || true
            /usr/bin/time -f "printf: %e s" bash -lc 'printf "%s|%s" a b > /tmp/diag.txt' || true
            /usr/bin/time -f "pipe: %e s" bash -lc 'head -c 10000 /dev/zero | tr "\0" "a"; exit 1' || true
          done
          echo "--- BASH_ENV/profile ---"
          echo "BASH_ENV=${BASH_ENV:-unset}"
          ls -la /etc/profile.d/ 2>/dev/null | head -20
          echo "--- isolated hook test ---"
          /usr/bin/time -f "hooktest: %e s" cargo test -p rhapsody-workspace --lib -- hook_failure_returns_err_hook_failed --nocapture || true
      - run: cargo test --workspace

  web:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, rhapsody-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on the self-hosted runner: the machine's npm cache is already
          # local + persistent, and the post-job step would upload ~1GB to GitHub per run.
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # Build the dashboard bundle into crates/httpapi/web-dist/ (vite outDir), the rust-embed
      # source for the embedded dashboard (P6-H1). Proves the build + outDir move stay green.
      - run: npm run build
        working-directory: web

  # F1 boot gate: the assembled `rhapsodyd` daemon completes a scripted issue end-to-end against the
  # R3 harness (linear-stub + fake-claude), serves the embedded dashboard non-empty, its live
  # /api/v1/config byte-matches the committed golden, and `rhapsodyd mcp` reaches it via runtime.json.
  # boot.sh builds the web dist (rust-embed source) then the daemon, so it is self-contained (jobs
  # don't share a filesystem). NOTE: add `boot-e2e` to the branch-protection required contexts to gate
  # merges on it (needs admin, like the lint/test/web contexts — see the PR body).
  boot-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Same split as `test`: the assembled daemon is exercised on Linux at PR time, on macOS on main.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["self-hosted","Linux","rhapsody-linux"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show
      - run: harness/e2e/boot.sh

  # The Tauri desktop app (P7) is its OWN cargo workspace, excluded from the root workspace, so it
  # is linted/built/tested here rather than by the `lint`/`test` jobs. Unsigned build only — the
  # signed/notarized .app + .dmg are human-gated (P7-D5 / desktop SIGNING). Job name `desktop` is a
  # branch-protection context; keep it stable.
  desktop:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show   # installs the toolchain pinned by the shared repo-root rust-toolchain.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` on the self-hosted runner (same rationale as the web job).
      # Since TRA-251 `web/` IS the Tauri window's frontend (tauri.conf.json `frontendDist` ->
      # crates/httpapi/web-dist) — the interim desktop/frontend shell was retired. The cargo steps
      # below compile against the committed `.gitkeep` anchor (an empty dist is fine —
      # `tauri::generate_context!` embeds whatever is there); `make app` builds the real bundle. `web/`
      # itself is built + tested by the `web` job.
      - run: cargo fmt --all --check
        working-directory: desktop
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: desktop
      # Unit + supervisor-lifecycle + packaging-gate tests. Default features build the `fakedaemon`
      # supervisor stub the integration tests need (the packaging build turns it off — see below).
      # `--locked` (STUDIO-1024) on every resolve step: the desktop workspace is excluded from the
      # root lock, so a manifest change here that is not matched by `desktop/Cargo.lock` used to be
      # silently re-resolved and go green. With `--locked` a stale lock fails CI instead.
      - run: cargo test --locked
        working-directory: desktop
      # P7-D5 packaging build gate: the Tauri bundler produces the UNSIGNED Rhapsody.app. The CLI
      # install is idempotent and persists on the self-hosted runner. `make app` (run from the repo
      # root) builds the web/ dashboard (both the daemon embed AND the Tauri frontend) + the release
      # rhapsodyd sidecar, bundles the app with the fakedaemon stub excluded (`--no-default-features`), and copies
      # the sidecar into Contents/Resources — everything the parity e2e below needs.
      #
      # We deliberately build `make app`, NOT `make dmg`, on PRs: the DMG packaging (hdiutil) is
      # release-only (release.yml builds + signs + notarizes it) and, because the self-hosted runner is
      # a dev Mac, `hdiutil` fails with "Operation not permitted" whenever a volume named `Rhapsody` is
      # already mounted (e.g. the app running from a mounted DMG). The parity e2e consumes the `.app`
      # bundle (Contents/MacOS -> Contents/Resources/rhapsodyd), never the `.dmg`, so `make app` is the
      # correct, collision-free PR gate.
      - run: command -v cargo-tauri >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked
      - run: make app
      # P7-D5 parity e2e: the app's supervisor drives the packaged rhapsodyd through
      # start -> healthy -> dashboard -> stop (against the R3 linear-stub + fake-claude harness). Gated
      # by RHAPSODY_PARITY_E2E so only this explicit step runs it (it needs the bundle `make app` built).
      - run: RHAPSODY_PARITY_E2E=1 cargo test --locked -p rhapsody-desktop --test parity_e2e -- --nocapture
        working-directory: desktop
