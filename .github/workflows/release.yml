name: release

# release-please keeps a rolling release PR open on main: every feat:/fix: merge updates it, and
# merging that PR cuts a vX.Y.Z tag + GitHub Release + CHANGELOG entry. release-please-config.json and
# .release-please-manifest.json define the flat single-package setup (path ".", `simple` release-type —
# tag/release/CHANGELOG only, no source-file rewrites in a virtual Cargo workspace). While we're pre-1.0
# both bump-*-pre-major flags are on, so feat: bumps the patch and a breaking change bumps the minor —
# routine shipping stays on 0.x.Y and never burns a minor. Cut a deliberate minor/major with a
# `Release-As: 0.5.0` footer on a commit. The Makefile's
# VERSION default consumes the resulting tag (leading `v` stripped) — see TRA-239. The `build` job
# below (TRA-240) turns that tag into a signed + notarized Rhapsody.dmg and uploads it to the Release.
on:
  push:
    branches: [main]
  # Manual dry-run (RD2 acceptance): point `tag` at an existing draft/prerelease and this builds,
  # signs, notarizes, spctl-verifies, and uploads the installer assets to that Release — no need to
  # wait for a real release-PR merge. release-please stays a no-op on this event (it only cuts a
  # release when a release-PR merge lands on main), so the build job keys off the `tag` input here.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (draft/prerelease) to build, sign, notarize & upload to
        required: true
        type: string

# release-please-action opens/updates the release PR (pull-requests) and creates the tag + GitHub
# Release (contents). GITHUB_TOKEN with these scopes is all it needs — no PAT. The `build` job reuses
# `contents: write` to upload assets to the Release via `gh release upload`.
permissions:
  contents: write
  pull-requests: write

# Serialize release-please so overlapping pushes to main can't race on the release PR; never cancel an
# in-flight run — cancelling mid-tag/release is worse than waiting. Run-level, so it also serializes
# the downstream build/upload against a second push racing to the same Release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Self-hosted only, matching ci.yml — this repo runs no ubuntu-latest/GitHub-hosted runners.
    # release-please-action is a node action, so it runs on the runner's bundled node (TRA-239).
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # STUDIO-408: a push to main that release-please neither released nor opened/updated a release PR
      # for is otherwise INVISIBLE — the job is green and says nothing, which is how 0.3.3 went missing
      # (#27's squash subject carried no conventional type, so release-please skipped it and nobody
      # noticed until `brew upgrade` had nothing to offer). Surface it as a warning annotation + a job
      # summary naming the subject that produced nothing.
      #
      # A WARNING, not a failure: a `chore:`/`docs:`/`test:`-only merge legitimately releases nothing,
      # and a red release workflow on those would be routine false noise that trains everyone to ignore
      # it. The hard gate belongs one step earlier, on the PR title, where the bad subject can still be
      # fixed — that is the `pr-title` workflow. This step is the backstop for whatever bypasses it
      # (a direct push to main, an admin merge, a merge commit).
      - name: Report when nothing was releasable
        if: >-
          github.event_name == 'push' &&
          steps.release.outputs.releases_created != 'true' &&
          steps.release.outputs.prs_created != 'true'
        env:
          # Via env, never inlined into the script: a commit message is untrusted text and `${{ ... }}`
          # interpolation inside a `run:` block is a shell-injection hole.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          echo "::warning title=No release proposed::release-please found nothing releasable in \"${subject}\" — no release PR, no tag, no signed dmg, no Homebrew cask bump, no manifest update. Expected for a chore:/docs:-only merge; if this was a fix:/feat:, its squash subject was probably not a conventional-commit subject (see the pr-title check)."
          {
            echo "### No release proposed"
            echo
            echo "release-please created no release and opened/updated no release PR for this push."
            echo
            echo '```'
            echo "${subject}"
            echo '```'
            echo
            echo "That is expected when the merge was \`chore:\`/\`docs:\`/\`test:\`-only. If it was meant"
            echo "to ship something, the subject above is most likely not a conventional-commit subject —"
            echo "release-please logs \`commit could not be parsed\` and stops, so the tag, the signed dmg,"
            echo "the Homebrew cask bump and \`.release-please-manifest.json\` are all skipped silently."
            echo
            echo "Fix forward by landing a conventional commit describing the change (an empty commit is"
            echo "fine), and check why the \`pr-title\` gate did not catch it."
          } >> "$GITHUB_STEP_SUMMARY"

  # TRA-240 (P8-RD2): on a real release (release-please cut a tag this run) OR a manual workflow_dispatch
  # dry-run against an existing draft/prerelease tag, build the desktop app, sign + notarize the dmg with
  # the runner's Developer ID, verify Gatekeeper acceptance, and attach the installer assets to the
  # GitHub Release. Self-hosted (davds-macbook-pro-rhapsody), matching ci.yml's `desktop` job.
  build:
    name: Signed dmg build & release upload
    needs: release-please
    # Real path: release-please created a release this run. Dry-run path: a human dispatched the
    # workflow with a `tag` input. release-please always *runs* (never event-gated, so never skipped),
    # which keeps `needs` satisfied and lets this be a plain condition — no always()/status gymnastics.
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Check out the exact tagged commit: the release-please tag on the real path, the dispatch input
      # on the dry-run path. Building from the tag (not branch HEAD) is what makes the uploaded binary
      # match the published Release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}

      # Same toolchain ci.yml's `desktop` job uses for `make dmg`: rustup on PATH (it lives in
      # ~/.cargo/bin, not the runner's seeded PATH), node for the web/ frontend bundle, and the Tauri
      # CLI (idempotent install — the CLI persists on the self-hosted runner between runs).
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show   # installs the toolchain pinned by rust-toolchain.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v cargo-tauri >/dev/null 2>&1 || cargo install tauri-cli --version "^2" --locked

      # Build + sign + notarize + staple the dmg. Signing turns ON because APPLE_SIGNING_IDENTITY (the
      # Developer ID, held as a repo VARIABLE — not a secret) and NOTARY_PROFILE are set: sign.sh signs
      # the rhapsodyd sidecar then the app under the hardened runtime, notarize.sh submits to Apple +
      # staples the ticket (desktop/SIGNING.md). The Developer ID cert AND the `rhapsody-notary` notary
      # profile live in a DEDICATED signing keychain (rhapsody-signing.keychain-db), unlocked below by
      # the throwaway KEYCHAIN_PASSWORD secret — never the machine's login (laptop) password (TRA-257).
      - name: Build, sign & notarize the dmg
        env:
          # Repo VARIABLE (not a secret): "Developer ID Application: David Johansen (6FLMY269LR)".
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          NOTARY_PROFILE: rhapsody-notary
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY repo variable is unset (expected the Developer ID Application identity)"
            exit 1
          fi
          version="${TAG#v}"   # Makefile stamps VERSION verbatim; strip the tag's leading v (v0.4.0 -> 0.4.0)
          echo "Building signed dmg for tag '$TAG' (VERSION=$version)"

          # Dedicated signing keychain (TRA-257): holds ONLY the Developer ID cert + the rhapsody-notary
          # profile, unlocked by the throwaway KEYCHAIN_PASSWORD secret — never the machine's login
          # (laptop) password. Operator setup is the one-time runbook in desktop/SIGNING.md.
          SIGNING_KEYCHAIN="$HOME/Library/Keychains/rhapsody-signing.keychain-db"
          # notarize.sh resolves the rhapsody-notary profile from this keychain (--keychain) instead of
          # notarytool's login-keychain default. Exported so `make dmg` -> notarize.sh inherits it.
          export NOTARY_KEYCHAIN="$SIGNING_KEYCHAIN"

          # Prepare the keychain UP FRONT (unconditionally, before make dmg — not only on a codesign
          # failure): unlock it, add it to the user search list so sign.sh (which pins no keychain)
          # resolves the Developer ID cert from it, and partition-list the signing key for
          # non-interactive codesign. -k passes the keychain password so the partition-list change is
          # non-interactive (no GUI prompt on the headless runner); -s matches signing keys.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"

          # Belt-and-suspenders: if codesign still hits errSecInternalComponent (signing key not
          # reachable non-interactively under this launchd session), re-unlock + re-partition the
          # dedicated keychain and retry once.
          log="$(mktemp)"
          if ! make dmg VERSION="$version" 2>&1 | tee "$log"; then
            if grep -q errSecInternalComponent "$log"; then
              echo "codesign hit errSecInternalComponent — re-unlocking + re-partitioning $SIGNING_KEYCHAIN"
              security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
              make dmg VERSION="$version"
            else
              echo "::error::make dmg failed for a reason other than errSecInternalComponent (see log above)"
              exit 1
            fi
          fi

      # RD2 acceptance gate (TRA-258): both the dmg AND the .app inside it are signed, notarized, and
      # OFFLINE-stapled. We assert on the "Notarized Developer ID" source line (the definitive signal
      # the ticket asks for) rather than spctl's exit code, which varies by assessment type across
      # macOS. `-t open` is the correct assessment for a .dmg (the old `-t install` is for .pkg
      # installers and rejects a .dmg as "no usable signature"); `-t exec` is correct for the .app.
      - name: Verify notarization (stapler + spctl, dmg + app)
        run: |
          set -euo pipefail
          dmg="desktop/build/bin/Rhapsody.dmg"

          # (a) The dmg's stapled ticket validates OFFLINE — hard gate.
          echo "== xcrun stapler validate (dmg) =="
          xcrun stapler validate "$dmg"

          # (b) Gatekeeper accepts the (now signed + notarized + stapled) dmg as a notarized Developer ID.
          echo "== spctl -a -t open (dmg) =="
          spctl -a -t open --context context:primary-signature -vvv "$dmg" 2>&1 | tee /tmp/spctl-dmg.out || true
          grep -q "Notarized Developer ID" /tmp/spctl-dmg.out \
            || { echo "::error::spctl -t open did not report 'Notarized Developer ID' for $dmg"; exit 1; }

          # (c) Mount the dmg and verify the .app INSIDE is itself a notarized Developer ID executable
          # whose ticket is stapled (TRA-258 staples the .app too, so a copied-to-/Applications app
          # validates offline). Detach on exit whether the checks pass or fail.
          mnt="$(mktemp -d)"
          trap 'hdiutil detach -force "$mnt" >/dev/null 2>&1 || true; rmdir "$mnt" 2>/dev/null || true' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          app="$mnt/Rhapsody.app"
          echo "== spctl -a -t exec (app inside the dmg) =="
          spctl -a -t exec -vv "$app" 2>&1 | tee /tmp/spctl-app.out || true
          grep -q "Notarized Developer ID" /tmp/spctl-app.out \
            || { echo "::error::spctl -t exec did not report 'Notarized Developer ID' for $app"; exit 1; }
          echo "== xcrun stapler validate (app) =="
          xcrun stapler validate "$app"

      # Attach the installer + raw daemon + checksums to the Release. --clobber makes re-runs (e.g. a
      # dry-run retried, or a keychain-unlock retry above) overwrite the assets instead of failing.
      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp desktop/build/bin/Rhapsody.dmg dist/Rhapsody.dmg
          cp target/release/rhapsodyd dist/rhapsodyd
          ( cd dist && shasum -a 256 Rhapsody.dmg rhapsodyd > SHA256SUMS )
          echo "== SHA256SUMS =="
          cat dist/SHA256SUMS
          gh release upload "$TAG" \
            dist/Rhapsody.dmg dist/rhapsodyd dist/SHA256SUMS \
            --clobber

      # TRA-261 (P11-U2): publish the in-app auto-update channel for the release the steps above just
      # signed + notarized + stapled. tauri-plugin-updater (wired in TRA-260/U1) polls the endpoint in
      # tauri.conf.json — releases/latest/download/latest.json — and, when it names a newer version,
      # downloads platforms."darwin-aarch64".url (a gzipped tarball of the app) and verifies it against
      # platforms."darwin-aarch64".signature (minisign) using the pubkey pinned in tauri.conf.json. A
      # bad/absent signature aborts the update, so nothing unsigned is ever installed.
      #
      # We build the tarball HERE, from the notarized + stapled bundle `make dmg` produced, rather than
      # via the bundler's `createUpdaterArtifacts` at `cargo tauri build` time: that runs BEFORE
      # sign.sh/notarize.sh, so its tarball would carry the Tauri-ad-hoc-signed, unstapled app — which
      # Gatekeeper would reject once the updater swapped it in. `cargo tauri signer sign` produces the
      # identical minisign signature the bundler would, against the same pubkey.
      #
      # Gated on TAURI_SIGNING_PRIVATE_KEY (the updater keypair — a human prerequisite, see
      # desktop/README.md "Auto-update"): with no key this cleanly no-ops, leaving the
      # dmg/binary/SHA256SUMS release above untouched (the release never goes red for a missing key).
      - name: Publish updater artifacts (tar.gz + latest.json)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — skipping the updater artifacts (Rhapsody.app.tar.gz + latest.json) for ${TAG}. Set the updater keypair secrets TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD to enable the in-app auto-update channel (see desktop/README.md 'Auto-update')."
            exit 0
          fi

          app="desktop/target/release/bundle/macos/Rhapsody.app"
          [ -d "$app" ] || { echo "::error::notarized app bundle not found at $app (the make dmg step must run first)"; exit 1; }

          version="${TAG#v}"   # Makefile stamps VERSION verbatim; strip the tag's leading v (v0.4.0 -> 0.4.0)
          rm -rf dist-updater && mkdir -p dist-updater
          tarball="$PWD/dist-updater/Rhapsody.app.tar.gz"

          # Gzip the notarized + stapled bundle with Rhapsody.app at the tar root — the archive shape
          # tauri-plugin-updater extracts. COPYFILE_DISABLE=1 suppresses BSD tar's AppleDouble (._*)
          # sidecars: the Developer ID signature (Contents/_CodeSignature/) and the stapled
          # notarization ticket (Contents/CodeResources) are regular FILES inside the bundle, so they
          # survive; the only xattrs would be local-run Gatekeeper state, which CI never creates.
          ( cd "$(dirname "$app")" && COPYFILE_DISABLE=1 tar -czf "$tarball" "$(basename "$app")" )

          # Minisign the tarball with the updater private key (read from env). Writes <tarball>.sig —
          # the single-line base64 blob latest.json's signature field carries verbatim.
          cargo tauri signer sign "$tarball"
          sig="$(cat "${tarball}.sig")"
          [ -n "$sig" ] || { echo "::error::empty updater signature for $tarball"; exit 1; }

          # Render latest.json (validated + escaped by the single-source-of-truth renderer, pinned by
          # render_latest_json_test.sh). url points at THIS release's uploaded tarball asset.
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          url="https://github.com/${REPO}/releases/download/${TAG}/Rhapsody.app.tar.gz"
          notes="Rhapsody ${version}. Release notes: https://github.com/${REPO}/releases/tag/${TAG}"
          desktop/scripts/render-latest-json.sh "$version" "$pub_date" "$sig" "$url" "$notes" \
            > dist-updater/latest.json
          echo "== latest.json =="
          cat dist-updater/latest.json

          # Attach the updater channel next to the dmg/binary/SHA256SUMS uploaded above. --clobber so a
          # retried dry-run overwrites the assets instead of failing on the existing ones.
          gh release upload "$TAG" \
            "$tarball" dist-updater/latest.json \
            --clobber

  # TRA-241 (P8-RD3) / TRA-270: after a REAL release, publish the version+sha cask bump to the public
  # Homebrew tap (makewhatis/homebrew-tap) so `brew upgrade --cask rhapsody` tracks the new dmg. The cask
  # body is regenerated by the SAME desktop/scripts/render-cask.sh that authored the committed cask, so the
  # tap and the repo never drift. The tap's `main` branch is UNPROTECTED (owner-controlled), so we push the
  # bump STRAIGHT to `main` — no branch, no PR, no manual merge. TRA-270 dropped the old branch+PR flow: the
  # v0.2.1 AND v0.2.2 cask PRs both sat unmerged while the signed Release had already moved on, so
  # `brew upgrade` reported "no updates". `needs: build` so the dmg + SHA256SUMS are already on the Release
  # before we read the checksum (jobs don't share a filesystem — the Release is the handoff).
  #
  # Auth: HOMEBREW_TAP_TOKEN — a fine-grained PAT with **Contents: read+write** on makewhatis/homebrew-tap
  # (GITHUB_TOKEN is scoped to THIS repo and can't push to a second one; a direct push to unprotected main
  # needs only Contents write — the same token that used to push the bump branch). The secret does NOT
  # exist yet; until an operator sets it (`gh secret set HOMEBREW_TAP_TOKEN --repo makewhatis/rhapsody`, see
  # desktop/README.md "Homebrew tap") this job cleanly SKIPS with a warning rather than turning the release
  # red. Skips on workflow_dispatch dry-runs (release_created is false).
  homebrew-bump:
    name: Bump Homebrew cask
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Check out the released tag so render-cask.sh matches the shipped release. This job compiles
      # nothing (pure shell + git + gh), so it needs no rust toolchain / cargo on PATH.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Push the Homebrew cask bump to tap main
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # GITHUB_TOKEN reads THIS repo's SHA256SUMS release asset; the tap push uses the PAT.
          RELEASE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew cask bump for ${TAG}. Set a fine-grained PAT (Contents: read+write on makewhatis/homebrew-tap) as the HOMEBREW_TAP_TOKEN secret to enable auto-bump (see desktop/README.md 'Homebrew tap')."
            exit 0
          fi

          version="${TAG#v}"
          echo "Bumping the Homebrew cask to ${version} (direct push to tap main)"

          tmp="$(mktemp -d)"
          # Pull the checksum from the SHA256SUMS asset the `build` job attached to this Release.
          GH_TOKEN="$RELEASE_READ_TOKEN" gh release download "$TAG" \
            --repo "$REPO" --pattern SHA256SUMS --dir "$tmp"
          sha256="$(awk '$2 == "Rhapsody.dmg" { print $1 }' "$tmp/SHA256SUMS")"
          if [ -z "$sha256" ]; then
            echo "::error::Rhapsody.dmg not found in the ${TAG} SHA256SUMS asset"
            exit 1
          fi
          echo "Rhapsody.dmg sha256=${sha256}"

          # Clone the tap on its default branch (main) with the PAT and regenerate the cask from the
          # single-source-of-truth renderer.
          tap="$tmp/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/makewhatis/homebrew-tap.git" "$tap"
          desktop/scripts/render-cask.sh "$version" "$sha256" > "$tap/Casks/rhapsody.rb"

          # Idempotency guard: a cask already at this version (e.g. the release re-run v0.2.2 needed) is a
          # clean no-op, not an error — skip before committing so the re-run stays green.
          if git -C "$tap" diff --quiet -- Casks/rhapsody.rb; then
            echo "Cask already at ${version} — nothing to bump."
            exit 0
          fi

          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Casks/rhapsody.rb
          git -C "$tap" commit -m "rhapsody ${version}"

          # Rebase onto the latest main in case it advanced since the clone, then push the bump STRAIGHT to
          # the tap's (unprotected) main — no branch, no PR, no manual merge.
          git -C "$tap" pull --rebase origin main

          # Fail the step LOUDLY on a rejected push (non-fast-forward race we lost, or main became
          # protected) — never silently drop the bump.
          if ! git -C "$tap" push origin HEAD:main; then
            echo "::error::Failed to push the rhapsody ${version} cask bump to makewhatis/homebrew-tap main — the bump was NOT published. See the push output above (non-fast-forward, or main is now protected)."
            exit 1
          fi
          echo "Pushed the rhapsody ${version} cask bump to makewhatis/homebrew-tap main."

  # STUDIO-648: the opt-in @rc channel. After a PRERELEASE tag has been built, signed, notarized and
  # uploaded by `build`, publish `Casks/rhapsody@rc.rb` to the same tap so
  # `brew install makewhatis/tap/rhapsody@rc` tracks prereleases. Same renderer, same tap, same token,
  # same straight-push-to-main as `homebrew-bump` — only the channel and the target file differ.
  #
  # WHY THIS FIRES ON workflow_dispatch AND NOT ON A `release: prereleased` TRIGGER
  # The bump has to read the dmg's checksum out of the Release's SHA256SUMS asset, which only exists
  # once `build` has uploaded it. `release: prereleased` fires when a Release is *published* as a
  # prerelease — i.e. BEFORE anything is built for it — so that trigger would race the assets it needs
  # (and would add a whole second event path to this workflow, under the release-please concurrency
  # group, for no gain). The dispatch path already creates the assets: it is exactly the flow that
  # produces an rc today (`gh workflow run release.yml -f tag=v0.3.4-rc.1`), and hanging the bump off
  # `needs: build` gives it the same assets-exist ordering guarantee `homebrew-bump` has. release-please
  # never cuts a prerelease itself (release-please-config.json is a plain `simple` package with no
  # prerelease config), so the dispatch path is the ONLY way an rc tag gets built — nothing is missed.
  #
  # CHANNEL ISOLATION
  #   - The stable cask is never touched here: this job writes exactly one file, `Casks/rhapsody@rc.rb`,
  #     and asserts that before it pushes. `homebrew-bump` above is untouched by STUDIO-648, so
  #     `brew upgrade --cask rhapsody` still only ever sees a real release.
  #   - The in-app auto-update channel needs NO machinery to stay stable-only: tauri-plugin-updater polls
  #     `releases/latest/download/latest.json`, and GitHub never points `releases/latest` at a release
  #     flagged `prerelease`. That holds by construction — so rather than build anything, we simply
  #     ASSERT the flag below, because a semver-prerelease tag published as a FULL release would quietly
  #     move every stable app's update check onto the rc.
  #   - An rc install's exit ramp is that same updater: tauri compares semver, and `0.3.4-rc.1 < 0.3.4`,
  #     so an rc auto-updates to the next FINAL release. That is the intended way off the channel.
  #
  # BOOTSTRAP: the tap needs no manual seed commit. `Casks/rhapsody@rc.rb` does not exist there yet; the
  # first prerelease run creates it (the idempotency guard below stages the file *before* diffing, so a
  # brand-new file registers as a change rather than looking like a no-op) and pushes it to tap main.
  homebrew-bump-rc:
    name: Bump Homebrew @rc cask
    needs: [release-please, build]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # Check out the dispatched tag so render-cask.sh matches the prerelease that was just built.
      # Pure shell + git + gh, so no rust toolchain / cargo on PATH.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Push the Homebrew @rc cask bump to tap main
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # GITHUB_TOKEN reads THIS repo's Release (SHA256SUMS + the prerelease flag); the tap push
          # uses the PAT. No new secret beyond the one homebrew-bump already needs.
          RELEASE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          # Channel gate: only a semver PRERELEASE tag feeds @rc. A dispatch dry-run against a
          # draft/stable tag (the RD2 flow) leaves the rc cask entirely alone.
          case "$version" in
            *-*) ;;
            *)
              echo "::notice::${TAG} is not a prerelease tag — leaving Casks/rhapsody@rc.rb alone. The stable cask is bumped by the homebrew-bump job on a real release."
              exit 0
              ;;
          esac

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew @rc cask bump for ${TAG}. Set a fine-grained PAT (Contents: read+write on makewhatis/homebrew-tap) as the HOMEBREW_TAP_TOKEN secret to enable auto-bump (see desktop/README.md 'Homebrew tap')."
            exit 0
          fi

          # Assert the isolation invariant rather than assume it (see the job comment): a prerelease tag
          # whose Release is NOT flagged `prerelease` would become `releases/latest`, pointing the stable
          # in-app updater — and every stable user — at an rc.
          is_prerelease="$(GH_TOKEN="$RELEASE_READ_TOKEN" gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)"
          if [ "$is_prerelease" != "true" ]; then
            echo "::error::${TAG} is a semver prerelease tag but its GitHub Release is not marked as a prerelease (isPrerelease=${is_prerelease}) — refusing to publish the @rc cask. Publishing it would let releases/latest point at ${TAG}, moving the stable in-app update channel onto an rc. Fix with 'gh release edit ${TAG} --prerelease' and re-run."
            exit 1
          fi

          echo "Bumping the Homebrew @rc cask to ${version} (direct push to tap main)"

          tmp="$(mktemp -d)"
          # Pull the checksum from the SHA256SUMS asset the `build` job attached to this Release.
          GH_TOKEN="$RELEASE_READ_TOKEN" gh release download "$TAG" \
            --repo "$REPO" --pattern SHA256SUMS --dir "$tmp"
          sha256="$(awk '$2 == "Rhapsody.dmg" { print $1 }' "$tmp/SHA256SUMS")"
          if [ -z "$sha256" ]; then
            echo "::error::Rhapsody.dmg not found in the ${TAG} SHA256SUMS asset"
            exit 1
          fi
          echo "Rhapsody.dmg sha256=${sha256}"

          # Clone the tap on its default branch (main) with the PAT and render the rc cask from the
          # single-source-of-truth renderer — the same script that authored the stable cask.
          tap="$tmp/homebrew-tap"
          cask="Casks/rhapsody@rc.rb"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/makewhatis/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          desktop/scripts/render-cask.sh "$version" "$sha256" rc > "$tap/$cask"

          # Stage BEFORE diffing: on the bootstrap run the cask is untracked, and `git diff` (worktree
          # vs index) would report no change for it and wrongly skip the very first publish. Staging
          # first makes `diff --cached` see an addition, while a re-run with identical content still
          # stages nothing and stays a clean no-op.
          git -C "$tap" add -- "$cask"
          if git -C "$tap" diff --cached --quiet; then
            echo "@rc cask already at ${version} — nothing to bump."
            exit 0
          fi

          # The stable cask must be untouched by this path. We only ever write $cask, so this can only
          # fire if the renderer or this script grew a second output — fail loud rather than push it.
          staged="$(git -C "$tap" diff --cached --name-only)"
          if [ "$staged" != "$cask" ]; then
            echo "::error::the @rc bump would change files other than ${cask} (staged: ${staged}) — refusing to push. This path must never touch the stable cask."
            exit 1
          fi

          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" commit -m "rhapsody@rc ${version}"

          # Rebase onto the latest main in case it advanced since the clone, then push STRAIGHT to the
          # tap's (unprotected) main — same mechanism TRA-270 settled on for the stable cask.
          git -C "$tap" pull --rebase origin main

          # Fail the step LOUDLY on a rejected push — never silently drop the bump.
          if ! git -C "$tap" push origin HEAD:main; then
            echo "::error::Failed to push the rhapsody@rc ${version} cask bump to makewhatis/homebrew-tap main — the bump was NOT published. See the push output above (non-fast-forward, or main is now protected)."
            exit 1
          fi
          echo "Pushed the rhapsody@rc ${version} cask bump to makewhatis/homebrew-tap main."
