[package]
name = "rhapsody-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# rhapsody-config: the facade's Client resolves its loopback base URL from `server.port`
# (config-only NewClient) and the runtime.json discovery falls back to it; the server takes the
# resolved `Config` exactly like Go's `mcpfacade.NewServer(cfg, …)`.
rhapsody-config = { path = "../config" }
# rhapsody-store: the run-status verdict compares outcomes against the store outcome taxonomy
# (OUTCOME_RUNNING / _COMPLETED / _CONTINUED / _STOPPED / _FAILED / _INTERRUPTED) — the SAME
# string constants Go's verdict.go imports from `internal/store`.
rhapsody-store = { path = "../store" }
# rmcp: the official Rust MCP SDK ($REF uses github.com/modelcontextprotocol/go-sdk/mcp; the plan
# mandates the Rust equivalent). `server` + `macros` give the tool system and #[tool] macros;
# `transport-io` is the stdio server the `symphony mcp` subcommand runs over. base64 (a `default`
# member) is unused, so default-features are off.
rmcp = { version = "2.2", default-features = false, features = ["server", "macros", "transport-io"] }
# reqwest: the daemon loopback HTTP client — the Rust mirror of Go client.go's `*http.Client`
# (15s timeout). Same feature set as rhapsody-tracker (macOS-native TLS, no blocking/gzip/json
# helpers): the facade only ever dials 127.0.0.1 over http, but the workspace pins one reqwest
# configuration.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
# serde + serde_json: the wire structs mirror the httpapi response shapes (client.go's minimal
# mirror) and the tool bodies are raw JSON proxied verbatim; Status marshals to JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# schemars: derives the JSON input schema for each tool's argument struct (rmcp's tool system
# requires `JsonSchema`); pinned to the 1.0 line rmcp's `server` feature depends on.
schemars = "1.0"
# chrono: the run-status liveness math — parse the daemon's RFC3339(Nano) `last_event_at`, take
# `now - t`, format the human age. The Rust mirror of Go verdict.go's `time.Parse` / `time.Now`.
chrono = { version = "0.4", features = ["clock"] }
# libc: `kill(pid, 0)` — the process-liveness probe that mirrors runtimeport.ProcessAlive, so a
# stale ~/.rhapsody/runtime.json from a crashed daemon doesn't pin discovery to a dead port. No
# std equivalent exists; libc is already in the workspace lockfile (reqwest/tokio pull it).
libc = "0.2"

[dev-dependencies]
# rmcp `client`: the in-memory MCP client the server tests drive the facade with — the Rust mirror
# of Go server_test.go's `mcp.NewInMemoryTransports()` (over a tokio duplex pipe).
rmcp = { version = "2.2", default-features = false, features = ["client"] }
# axum + tokio: the small loopback stub the client/status/server tests dial in place of Go's
# `net/http/httptest`, and which serves the committed `harness/fixtures/api/*.json` in the
# integration test.
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
# harness-fixtures: loads the committed golden api fixtures the integration stub serves.
harness-fixtures = { path = "../harness-fixtures" }
# rhapsody-config (already a normal dependency): the integration test — a consumer of the public
# `Facade::new(&Config, …)` surface — builds a defaulted Config to pass in, exactly as F1's cmd layer
# will. Listed here too so it is linkable from the separate `tests/` crate. Not a new external dep.
rhapsody-config = { path = "../config" }

[lints]
workspace = true
