[package]
name = "rhapsody-config"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rhapsody-core = { path = "../core" }
liquid = "0.26"
# serde derive powers the raw front-matter model in `model.rs` (C3), deserialized by
# serde_yaml_ng — the same `serde = { derive }` the core crate uses.
serde = { version = "1", features = ["derive"] }
# serde_yaml_ng: maintained fork of the now-archived serde_yaml; its libyaml
# parser matches gopkg.in/yaml.v3 map/seq/scalar semantics used by WORKFLOW.md.
# (Choice justified in the C2 PR body.)
serde_yaml_ng = "0.10"
# serde_json powers the `effective_json` view (C6): the plan's `render(..) -> serde_json::Value`
# reproduces the Go `GET /api/v1/config` JSON shape (P6 reuses this module).
serde_json = "1"
thiserror = "1"
chrono = "0.4"

[dev-dependencies]
# Golden parity assertions for the effective-config view (C6): load the committed fixtures and
# apply the shared `normalize` rules (Task R5).
harness-fixtures = { path = "../harness-fixtures" }
# tempfile: scratch dirs for the capabilities load_or_seed round-trip tests. Pinned to the
# version already locked in the workspace (transitively via native-tls).
tempfile = "3.27.0"

[lints]
workspace = true
