[package]
name = "rhapsody-config"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rhapsody-core = { path = "../core" }
# async-trait: `memory::MemoryBackend` is held as `Arc<dyn MemoryBackend>` by the daemon's off-loop
# endpoints, and native `async fn` in traits is not dyn-compatible. The trait is async because T8's
# `hindsight` backend does network I/O — which is exactly what makes it unusable on the dispatch
# path (see `memory`'s module docs). Same version the httpapi/tracker/agent crates already record;
# already in Cargo.lock, so no new external crate enters the tree.
async-trait = "0.1"
liquid = "0.26"
# reqwest: the `hindsight` memory backend's HTTP transport (STUDIO-660, T8) — the shared cloud bank
# behind the same `MemoryBackend` trait. Same version + same `default-features = false` +
# `default-tls` shape the tracker / mcp / httpapi crates already record (the tailnet endpoint is
# https, so a TLS backend is required); already in Cargo.lock, so no new external crate enters the
# tree. Deliberately NOT reachable from the dispatch path — see `hindsight`'s module docs.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
# tracing: `hindsight`'s ONE self-logged degradation — the best-effort `enable_observations: false`
# bank write, which happens inside a `retain` whose own result must still be returned, so there is
# no caller to hand the reason to. Every other diagnostic in this crate still travels to the caller
# that owns the log. Already in Cargo.lock (orchestrator / tracker / store depend on it).
tracing = "0.1"
# serde derive powers the raw front-matter model in `model.rs` (C3), deserialized by
# serde_yaml_ng — the same `serde = { derive }` the core crate uses.
serde = { version = "1", features = ["derive"] }
# serde_yaml_ng: maintained fork of the now-archived serde_yaml; its libyaml
# parser matches gopkg.in/yaml.v3 map/seq/scalar semantics used by WORKFLOW.md.
# (Choice justified in the C2 PR body.)
serde_yaml_ng = "0.10"
# serde_json powers the `effective_json` view (C6): the plan's `render(..) -> serde_json::Value`
# reproduces the Go `GET /api/v1/config` JSON shape (P6 reuses this module).
serde_json = "1"
thiserror = "1"
chrono = "0.4"

[dev-dependencies]
# Golden parity assertions for the effective-config view (C6): load the committed fixtures and
# apply the shared `normalize` rules (Task R5).
harness-fixtures = { path = "../harness-fixtures" }
# tempfile: scratch dirs for the capabilities load_or_seed round-trip tests. Pinned to the
# version already locked in the workspace (transitively via native-tls).
tempfile = "3.27.0"
# tokio: drives the handful of `#[tokio::test]`s that exercise the async `MemoryBackend` surface
# (the sync `LocalBank` methods need no runtime). Already in Cargo.lock workspace-wide.
# `net` + `io-util` back the hand-rolled loopback hindsight stub the T8 tests answer from — the
# same shape `rhapsody-tracker`'s `linear::testutil` mock server uses in place of Go's httptest.
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
