[package]
name = "rhapsody-provider-broker"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# zeroize: the primary credential/capability buffer is wrapped in `Zeroizing` so the allocation
# Rhapsody owns is wiped on drop (PB1 acceptance: secret types zeroize their primary allocation).
# Already in Cargo.lock (a rustls/ring transitive); no new crate enters the lock.
zeroize = "1"
# sha2: turn tokens are stored and looked up only by `SHA-256("rhapsody-provider-turn-v1\0" || token)`
# and binding fingerprints are the same shape of non-secret digest. Already in the lock.
sha2 = "0.10"
# base64: the turn token is 32 CSPRNG bytes encoded as 43 unpadded base64url ASCII characters
# (provider-broker-design §4.1). Already in the lock.
base64 = "0.22"
# getrandom: the OS CSPRNG behind `OsRandom` (design §4.1). Injected/scripted in tests. Already in
# the lock.
getrandom = "0.2"
# thiserror: typed, actionable broker errors (refusals are values, never panics). Already in the lock.
thiserror = "1"

# ---- PB2: the private loopback listener and the fixed outbound client (design §2.1, §5, §6) ----
# The PB1 crate deliberately carried no HTTP stack; PB2 owns the one loopback listener, so the
# dependency direction guard is relaxed for exactly these crates. Every crate below is already in
# Cargo.lock (axum/hyper/hyper-util/reqwest are the versions the rest of the workspace and the
# `linear-stub` already use) — no new external crate enters.
#
# axum/hyper/hyper-util: the loopback server is built on hyper's HTTP/1 builder directly (not
# `axum::serve`) so HTTP/1-only serving, the header-read timeout, the header ceiling and the
# connection/request ceilings can be enforced as §5.1 requires; axum is only the router.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = "0.8"
# tokio: the async runtime the listener serves on (`net`/`time`), plus the sync primitives the
# connection ceiling needs. Already in Cargo.lock.
tokio = { version = "1", features = ["net", "time", "sync"] }
# http / http-body / http-body-util / bytes: the request/response types the handler and the fixed
# outbound adapter construct without copying the incoming header map (§5.4).
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
# futures-util: `StreamExt::next` + `stream::unfold` shape the backpressured, redacted, bounded
# response body (§7.1) without a detached forwarding task.
futures-util = "0.3"
# tower: the `Service`/`service_fn` glue between hyper's connection driver and the axum router.
tower = { version = "0.5", features = ["util"] }
# serde_json: the bounded parser produces `serde_json::Value` for outbound re-serialization, and the
# response redactor/observer walk provider JSON. Already in Cargo.lock.
serde_json = "1"
# serde (derive): `NonStreamingBody` deserializes a non-streaming provider response once, validating
# it as a JSON object and reading `usage` while skipping (and not allocating) every other field. A
# whole-body `serde_json::Value` tree would amplify a bounded response into far more memory than its
# byte budget charges. serde/serde_derive are already in Cargo.lock; only the derive feature is newly
# enabled here.
serde = { version = "1", features = ["derive"] }
# url: the one normalized upstream base URL and its exact round-trip validation (§6.1). Already in
# Cargo.lock.
url = "2"
# reqwest: the fixed outbound HTTP client (§6.2). `default-tls` = platform trust roots with hostname
# validation (native-tls), never inherited CA env. `default-features = false` drops decompression, so
# only `identity` is accepted; the response body is pulled via `Response::chunk` (no `stream` feature
# needed, so no extra lock entries).
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

[dev-dependencies]
# static_assertions: `assert_not_impl_any!` is the standard stable-Rust negative-impl guard
# (`CapabilityToken` is not `Clone`/`Display`/`Serialize`, custody handles are not `Clone`). Already
# in the lock as a transitive; test-only here.
static_assertions = "1"
# tokio test runtime extras: `#[tokio::test]` with a real multi-threaded runtime for the loopback
# listener + fake upstream tests. Already in Cargo.lock.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
