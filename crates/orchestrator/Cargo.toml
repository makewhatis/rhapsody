[package]
name = "rhapsody-orchestrator"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rhapsody-core = { path = "../core" }
rhapsody-config = { path = "../config" }
rhapsody-tracker = { path = "../tracker" }
rhapsody-workspace = { path = "../workspace" }
rhapsody-agent = { path = "../agent" }
# rhapsody-store: the durable history + recovery store. O2 is its first orchestrator consumer —
# `last_run_started_at` (dispatch.rs) reads `issue_history` for the summons-suppression watermark,
# so the `Orchestrator` gains the store handle (Go `orchestrator.go`'s `pstore`, defaulted to Noop)
# now; O4 layers the write-side run lifecycle on top. Consumed per the P5 plan's dep set.
rhapsody-store = { path = "../store" }
# chrono: the orchestrator's clock (`now`), retry due-times, and the effective stall-timeout
# duration — the Rust mirror of Go's `time` package. Anticipated by the P5 plan's dep set.
chrono = "0.4"
# thiserror: `OrchestratorError`'s typed variants (Display strings are the observable contract),
# mirroring the Go package's sentinel errors. Anticipated by the P5 plan's dep set.
thiserror = "2"
# tracing: the effective builder's best-effort warn diagnostics (Go logs these via `slog`; the
# workspace convention is `tracing`, as the sibling crates record). Anticipated by the P5 plan.
tracing = "0.1"
# regex: ghsummons `parse_repo` mirrors Go `ghsummons.ParseRepo`'s single compiled remote-URL
# pattern. Already in the workspace tree (rhapsody-core / rhapsody-tracker depend on it), so no new
# crate enters Cargo.lock.
regex = "1"
# tokio: O2's pool-mode claim protocol (`claim.rs`) is async — it drives the async `Tracker` trait
# and waits out the jittered settle window (`tokio::time::sleep`, Go's `sleepCtx`). O3's worker
# threads the operator-message receiver (Go's `messages <-chan string`) to `Session::run_turn`, which
# needs `sync` to name `tokio::sync::mpsc::Receiver`. The control-loop runtime is O7's. Anticipated by
# the P5 plan's dep set; already in Cargo.lock (agent/workspace/tracker depend on it).
tokio = { version = "1", features = ["sync", "time"] }
# serde_json powers the O4 `snapshot_json` view — the `/api/v1/state` wire render (`render(&Snapshot)
# -> serde_json::Value`, mirroring Go httpapi `toStateJSON`). Following the config crate's
# `effective_json` convention, the domain crate owns its wire view + parity gate and P6 reuses it
# rather than reimplementing the serialization. `serde` is in the P5 plan's anticipated dep set;
# `serde_json` (its JSON codec) is already in Cargo.lock via config/store — no new crate enters the tree.
serde_json = "1"

[dev-dependencies]
# harness-fixtures (test-only): the O4 snapshot-shape cross-check renders a snapshot through
# `snapshot_json`, normalizes it, and asserts byte-equality with the committed `api/state.json`
# fixture — the same golden pattern the config crate's `tests/golden.rs` uses. Already in Cargo.lock.
harness-fixtures = { path = "../harness-fixtures" }
# serde_yaml_ng: the effective tests parse WORKFLOW.md front matter into the config crate's
# `YamlMap` (the same helper the config crate's own tests use), mirroring Go `effective_test.go`'s
# `decodeCfg`. Already in Cargo.lock (a rhapsody-config dependency) — no new crate enters the tree.
serde_yaml_ng = "0.10"
# tracing-subscriber (test-only): a recording event Layer that captures the INF-249 blocked-skip
# `tracing` diagnostics so the `select` log tests can assert them by SEMANTIC field (Go's
# `dispatch`/`select_test` capture the equivalent `slog` output to a buffer). The Rust analogue is
# the same recording-layer pattern the tracker crate's `tracing_test` already uses; already in
# Cargo.lock, so no new crate enters the tree.
tracing-subscriber = "0.3"
# tokio (test-only extras): the `macros` + `rt` features power `#[tokio::test]` and the `tokio::join!`
# the claim-contention test uses to race two daemons; `rt-multi-thread` powers the O4 reads-target
# race test (`reads.rs`), which mirrors Go's `-race` `TestReadsTargetRace` by driving the `RwLock`
# guard from real parallel tasks (the same pattern the workspace crate's repo race tests use). The
# `time` feature is inherited from the non-dev dependency above. Already in Cargo.lock.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
