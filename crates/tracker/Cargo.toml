[package]
name = "rhapsody-tracker"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rhapsody-core = { path = "../core" }
# async-trait: the Tracker interface is async (the orchestrator is tokio-based and the linear
# adapter does HTTP), and the factory hands back a `Box<dyn Tracker>` — a trait object. Native
# `async fn` in traits is not dyn-compatible, so the object-safe form requires async-trait
# (anticipated by the P3 plan, T1).
async-trait = "0.1"
# chrono: the fake stamps created claim comments with a clock defaulting to `Utc::now()` — the
# Rust mirror of Go's `time.Now()` — and stores them as `core::Comment.created_at`. The `serde`
# feature (de)serializes the file adapter's RFC3339 timestamps (schema `DateTime<FixedOffset>`, T2);
# the linear adapter's normalize also parses Linear's RFC3339 timestamps into `DateTime<Utc>` (T3).
chrono = { version = "0.4", features = ["clock", "serde"] }
# reqwest: the Linear adapter's GraphQL transport (`doGraphQL`) — the Rust mirror of Go's
# `net/http` client (client.go). default-tls (native-tls) is used rather than rustls: CI and dev
# are macOS, where native-tls is Security.framework (no OpenSSL/cmake build step). Default
# features are off — only the async client + TLS are needed (no blocking client, gzip, or json
# body helper; the request body is built with serde_json to mirror Go's `json.Marshal`). P3 T3.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
# serde + serde_json: the file adapter (T2) is JSON-backed — it parses and atomically rewrites its
# source file; the linear adapter (T3) derives Deserialize on `rawIssue` and marshals the request
# body + decodes the GraphQL envelope. Both mirror Go's `encoding/json`; same versions as core/config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# regex: normalize.go's GitHub-PR url matchers (`prURLRe`, `prParseRe`) — mirrored as compiled
# patterns; the summon matcher is reused from `rhapsody-core`. P3 T3.
regex = "1"
# tracing: the per-operation `symphony.tracker.<op>` spans (tracing.go). The Go adapter uses
# OpenTelemetry directly; the idiomatic Rust mirror is the `tracing` facade (anticipated by the
# P3 plan, T3). P3 T3.
tracing = "0.1"
# tokio (sync only): the linear adapter caches the resolved viewer + milestone id behind a mutex
# held ACROSS the GraphQL await (single-flight resolution, mirroring Go holding `viewerMu` /
# `milestoneMu` across the network call). `std::sync::Mutex` cannot: its guard is `!Send`, so it
# cannot cross the `.await` in a `Send` async-trait future, and clippy denies await-holding-lock.
# `tokio::sync::Mutex` is built for exactly this. tokio was anticipated as a tracker dependency by
# the P3 plan (T1); only the `sync` feature is needed here (the runtime stays test-only). P3 T4.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
# tokio (test-only): a current-thread runtime for `#[tokio::test]`, which drives the async
# Tracker methods the fake tests exercise. `net` + `io-util` back the hand-rolled loopback HTTP
# server the transport tests use in place of Go's `net/http/httptest` (P3 T3).
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
# tracing-subscriber (test-only): a recording span layer for the tracing test — the Rust analogue
# of Go's `go.opentelemetry.io/otel/sdk/trace/tracetest.SpanRecorder` (tracing_test.go). P3 T3.
tracing-subscriber = "0.3"

[lints]
workspace = true
