[package]
name = "rhapsody-telemetry"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The OpenTelemetry Rust stack — the parity mirror of Go's `go.opentelemetry.io/otel` SDK +
# OTLP exporters (traces/metrics/logs). `init` wires providers from the `otel:` config block.
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs"] }
# tls-ring + tls-roots give the gRPC (tonic) exporter a rustls provider and the *platform* trust
# store (rustls-native-certs: Security.framework on macOS, OpenSSL + system ca-certificates on
# Linux) — Go's default (non-`WithInsecure`) transport, which uses the OS cert pool. Native roots
# rather than the bundled `tls-webpki-roots`: the OS store receives distrust updates (as it did for
# the 2026-10-17 eMudhra intermediates) without a daemon release. See `exporters.rs`'s
# `tonic_tls_config`, which is what actually turns the roots on — tonic's own default is an *empty*
# trust store, so a secure endpoint fails closed without it.
opentelemetry-otlp = { version = "0.32", features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client", "tls-ring", "tls-roots"] }
# reqwest (0.13 — the version opentelemetry-otlp's blocking HTTP client is built from): enabling its
# `native-tls` backend is what lets an `https://` OTLP/HTTP endpoint verify against the platform
# trust store, the same roots every other daemon HTTPS client uses. Feature-unified onto
# opentelemetry-otlp's own reqwest dependency, so no second copy of the crate enters the build.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# tracing bridge: the daemon records spans/logs via `tracing`; `tracing-opentelemetry` fans spans to
# the OTLP trace provider (Go's `otelslog` + `otel.SetTracerProvider`).
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.33"
# tracing-appender: the rolling-file layer that writes the daemon's process log to `logging.dir`
# (daily rotation + max_log_files pruning). New in TRA-267 — a documented divergence: Go v0.4.0 keeps
# `logging.dir` config-only with no file writer. Non-blocking mode returns a WorkerGuard held on
# `Telemetry` for the process lifetime so the writer keeps flushing.
tracing-appender = "0.2"
# url: `endpoint_url_for_signal` fills the per-signal `/v1/*` OTLP path on a path-less endpoint
# (Go `endpointURLForSignal`, the 404 fix). Already in the workspace lock.
url = "2"
# serde + chrono: `LogEntry` is the in-app Logs-tab record the P6 httpapi `/api/v1/logs` handler
# serializes (Go `telemetry.LogEntry`, json-tagged); `time` is its timestamp. Already in the lock.
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
# libc: `host.name` resource attribute via `gethostname` — Go's `resource.WithHost()` (the SDK does
# NOT auto-detect it). Already in the lock; matches the workspace's libc-over-new-crate idiom.
libc = "0.2"
# http: bridges the `otel.headers` config map into a gRPC `MetadataMap` (Go's OTLP `WithHeaders` on
# the gRPC exporter). Ubiquitous, already in the lock (reqwest/tonic depend on it).
http = "1"
# opentelemetry-appender-tracing: fans `tracing` events into the OTLP LoggerProvider — the Rust
# analogue of Go's `otelslog` handler in the log multi-handler (the daemon's log-export path).
opentelemetry-appender-tracing = "0.32"
# tokio (rt): the bounded-shutdown worker enters the daemon's tokio runtime so the gRPC exporter's
# final flush has a reactor (Go bounds the same flush via a shutdown context). Already in the lock.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
# testing: the `InMemoryMetricExporter` the metrics tests collect through (Go's ManualReader
# analogue). A dev-only feature so it never enters the production lib.
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
# The `tests/tls_native_roots.rs` harness stands up real local TLS servers (gRPC + HTTP) with a
# throwaway CA so it can prove the exporters actually verify against the platform trust store:
#   - rcgen mints the test CA + server certificate (dev-only; never linked into the daemon).
#   - tonic (server + tls-ring) is the gRPC server, mirroring opentelemetry-otlp's own smoke test.
#   - opentelemetry-proto's generated `TraceService` is the mock gRPC service the exporter calls.
#   - native-tls is the HTTP server's TLS acceptor (the same OpenSSL the OTLP/HTTP client uses on
#     Linux, so the test exercises one TLS stack end to end).
# Every crate here is already in the workspace lock except rcgen (a small cert-minting crate).
rcgen = "0.13"
tonic = { version = "0.14", features = ["server", "transport", "tls-ring"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace"] }
native-tls = "0.2"
# tokio-stream: `TcpListenerStream` feeds the tonic test server's `serve_with_incoming`, so the test
# can bind port 0 and learn the assigned port (already in the workspace lock).
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
