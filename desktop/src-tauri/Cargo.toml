[package]
name = "rhapsody-desktop"
description = "Rhapsody desktop app — supervises the rhapsodyd sidecar and shows its dashboard."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
# The crate ships three bin targets (the `rhapsody-desktop` app, the `fakedaemon` supervisor test
# stub, and — implicitly — cargo's per-file discovery). `cargo tauri build` bundles the package's
# DEFAULT binary; without this it picks `fakedaemon` (alphabetically first), producing a broken
# Rhapsody.app whose Contents/MacOS is the stub. Pin the app as the default so the bundler embeds it.
default-run = "rhapsody-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the menu-bar tray (TrayIconBuilder) the D3 shell owns — $REF/desktop/tray.go.
tauri = { version = "2", features = ["tray-icon"] }
# P11-U1 in-app auto-update (this task has no Go parity — a Rhapsody-only feature). `tauri-plugin-updater`
# drives check → download → install with Tauri's BUILT-IN minisign signature verification against the
# `plugins.updater.pubkey` in tauri.conf.json (a tampered/mismatched artifact is rejected before install).
# `tauri-plugin-process` supplies the relaunch primitive the post-install restart uses. Both are the
# Tauri-official 2.x plugins, pinned to the same major as `tauri`; the two new direct deps are the ones
# the P11 plan (Task U1) anticipates. NOTE: these produce NO updater artifacts at build time —
# `bundle.createUpdaterArtifacts` is deliberately left unset so the unsigned `make app` CI build needs no
# signing key (the signed release artifacts are a later, human-gated release-pipeline concern).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri-plugin-dialog (TRA-268): the native folder/file chooser behind Settings' "Logs path" and the
# Tools-tab executable-path pickers (bindings.ts `pickDirectory`/`pickFile`). Before this the pickers
# were dead stubs (a leftover from the TRA-251 Wails→Tauri shell migration). Tauri-official 2.x plugin,
# pinned to the same major as `tauri`; the `dialog:allow-open` permission is granted in
# capabilities/default.json (a Tauri v2 gotcha — without it the dialog IPC is silently denied).
tauri-plugin-dialog = "2"
# semver (TRA-266): parse the Makefile-stamped RHAPSODY_VERSION so the updater compares latest.json
# against the REAL release version, not tauri.conf.json's static 0.1.0 (see update.rs). This is the
# SAME semver crate `tauri-plugin-updater` already uses for `RemoteRelease.version`, so its
# `version_comparator` type-checks against it; it is already in desktop/Cargo.lock transitively, so
# declaring it directly adds only an edge, no new download.
semver = "1"
serde = { version = "1", features = ["derive"] }
# The D2 sidecar supervisor + same-origin api proxy (parity port of $REF/desktop/internal/supervisor
# + $REF/desktop/apiproxy.go). Every crate below is ALREADY in this workspace's Cargo.lock, pulled in
# transitively by `tauri` — declaring them directly adds no new downloads, only a direct edge.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util", "signal"] }
# `json` decodes the daemon's /api/v1/state for the tray's live agent count (App::agent_count,
# mirroring $REF/desktop/app.go). `native-tls` (D4) links macOS's Security framework — the same
# trust store Go's net/http uses — so `linearprojects` can reach https://api.linear.app for the
# onboarding project picker; the pre-D4 loopback-only usage (apiproxy + agent count) needed no TLS.
# native-tls (not rustls) reuses the security-framework crate keyring already pulls and needs no C
# crypto toolchain (cmake/aws-lc-rs) on the runner. serde_json is already in this workspace's lock.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# serde_json (D4): parses Linear's GraphQL responses in `linearprojects` (mirror of
# $REF/desktop/internal/linearprojects, which uses encoding/json) and (de)serializes the tool-doctor
# override prefs map (mirror of $REF/desktop/internal/prefs). Already in this workspace's Cargo.lock
# (dev-dep + reqwest's `json`), so promoting it to a direct dep adds no new download.
serde_json = "1"
# keyring (D4): the macOS Keychain-backed Linear-token store (mirror of $REF/desktop/internal/
# credential's zalando/go-keyring usage). `apple-native` uses the Security framework directly, so an
# unsigned build still reads/writes the login keychain; the 0600 file fallback covers write friction.
# Plan-anticipated ("Keychain via the security-framework/keyring crate").
keyring = { version = "3", features = ["apple-native"] }
# serde_yaml_ng (D4): renders the onboarding WORKFLOW.md front matter (mirror of
# $REF/desktop/internal/onboarding, which uses gopkg.in/yaml.v3). This is the SAME maintained
# serde_yaml fork the daemon's `rhapsody-config` uses, so the generated YAML parses back identically.
serde_yaml_ng = "0.10"
http = "1"
url = "2"
libc = "0.2"
# hyper (+ hyper-util / http-body-util / bytes) back the fakedaemon test stub's /healthz server and
# the apiproxy unit-test backend — the Rust equivalents of Go's net/http + httptest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
# supervisor lifecycle tests are integration tests (tests/): they launch the real compiled
# `fakedaemon` bin (via CARGO_BIN_EXE_fakedaemon) and drive start/health/restart/drain, mirroring
# $REF/desktop/internal/supervisor/supervisor_test.go. libc is used to assert the process-group setup.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
libc = "0.2"
# The P7-D5 parity e2e (tests/parity_e2e.rs) drives the app's apiproxy + a dashboard fetch against the
# real supervised daemon. These are ALREADY regular dependencies (same versions/features) — repeating
# them here only grants the separate integration-test crate extern access; no new crate is added.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
http = "1"
bytes = "1"
# serde_json (TRA-269): the capabilities-ACL regression test in tests/packaging_gate.rs parses
# capabilities/default.json to assert the window-drag grant is present. Already a regular dependency
# (same version/features) — repeating it here only grants the separate integration-test crate extern
# access; no new crate is added.
serde_json = "1"

[features]
# `fakedaemon` gates the compile of the supervisor test-stub bin below. It is a DEFAULT feature, so a
# plain `cargo build` / `cargo test` / `cargo clippy` builds it — the supervisor + e2e integration
# tests need `CARGO_BIN_EXE_fakedaemon` at compile time (P7-D5). The packaging build turns it OFF via
# `cargo tauri build --no-default-features` (Makefile `app` target) so the stub is NOT shipped inside
# Rhapsody.app: the Tauri bundler copies EVERY built package bin into `Contents/MacOS/`, and a stray
# unsigned Mach-O there would both be wrong hygiene and break the hardened-runtime `--deep --strict`
# signing/notarization path (SIGNING.md).
default = ["fakedaemon"]
fakedaemon = []

# `src/main.rs` (the `rhapsody-desktop` app bin) and `src/lib.rs` (the D2 supervisor/apiproxy/tooldirs
# library) are autodiscovered. `fakedaemon` is declared explicitly so `required-features` can gate it
# out of the shipped bundle while keeping it available to `cargo test`.
[[bin]]
name = "fakedaemon"
path = "src/bin/fakedaemon.rs"
required-features = ["fakedaemon"]

[lints]
workspace = true
