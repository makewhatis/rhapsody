# The desktop app is its OWN cargo workspace — deliberately NOT a member of the repo-root workspace
# (which excludes `desktop`). This mirrors the Go module boundary ($REF/desktop is its own Go module)
# so Tauri's heavy dependency tree stays out of the `symphonyd` daemon build, and `cargo test
# --workspace` / `make lint` at the repo root never compile it.
[workspace]
resolver = "3"
members = ["src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
repository = "https://github.com/makewhatis/rhapsody"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
